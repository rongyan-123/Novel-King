<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel-King · 写作工作台</title>
  <script src="/appearance.js"></script>
  <script>
    NovelKingAppearance.apply(document, NovelKingAppearance.read(localStorage), matchMedia('(prefers-color-scheme: dark)').matches);
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/file-library.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-head">
        <button class="icon-btn" data-action="back-works" title="返回作品列表">🏠</button>
        <span class="sidebar-logo">📖</span>
        <div class="sidebar-title" id="sidebar-title">Novel-King</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-section-label" data-nav-section="global">创作</div>
        <button data-view="works" data-nav-section="global" title="管理作品与继续写作">▤ <span>我的书架</span></button>
        <button data-view="library" data-nav-section="global" title="上传、阅读与整理写作资料">▱ <span>文件库</span></button>
        <button data-view="ai" data-nav-section="global" title="模型、运行时与 AI 工具">⚙ <span>AI 中心</span></button>
        <div class="nav-section-label" data-nav-section="workspace">作品空间</div>
        <button data-view="writing" data-nav-section="workspace" title="写正文与画大纲：左侧章节目录，右侧角色、设定与 AI 工具">✍ <span>写作台</span></button>
        <button data-view="settings" data-nav-section="workspace" title="管理角色、世界观和设定">♙ <span>角色与设定</span></button>
        <details class="sidebar-more"><summary>⋯ 更多工具</summary>
        <button data-view="ai-create" data-nav-section="global" title="自动创建小说与批量创作">✦ <span>批量 AI 创作</span></button>
        <button data-view="overview" data-nav-section="workspace" title="作品的数据统计">▦ <span>作品统计</span></button>
        <button data-view="ai-board" data-nav-section="workspace" title="高级故事状态与诊断工具">◈ <span>高级故事工具</span></button>
        <button data-view="thanks" data-nav-section="support" title="本工坊实际用到的开源组件、设计参考来源与许可核验记录">✦ <span>借鉴与致谢</span></button>
        <button data-view="trace" data-nav-section="support" title="排查问题用：把每次操作跑了哪些代码、花了多久、调了什么 AI 录成可回看的调用链。正常写作可以无视">⌁ <span>运行追踪</span></button>
        <button data-view="logs" data-nav-section="support" title="排查问题用：错误、慢操作、进程异常的记录。正常写作可以无视">≡ <span>日志</span></button>
        </details>
      </nav>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="折叠/展开侧栏">◀</button>
          <span class="topbar-title" id="topbar-title">Novel Studio</span>
        </div>
        <div class="search-box">
          <input type="search" id="global-search" placeholder="搜索章节 / 设定 / 角色…  Ctrl K 打开命令面板" autocomplete="off" aria-label="全局搜索">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-context" id="topbar-context" aria-live="polite"></div>
        <div class="topbar-right" id="topbar-right"><button class="btn small secondary" data-action="open-command-palette" title="搜索（Ctrl/Cmd+K）">⌕ 搜索</button></div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="command-palette-root"></div>
  <div id="toast-root"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="ai-task-progress" class="ai-task-progress" hidden></div>
  <script src="/long-text.js"></script>
  <script src="/writing-workspace.js"></script>
  <script src="/file-library.js"></script>
  <script src="/app.js"></script>
</body>
</html>
