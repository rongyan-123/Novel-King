services:
  novel-king:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOVELKING_PORT:-3741}:3741"
    environment:
      NOVELKING_PUBLIC_ORIGIN: ${NOVELKING_PUBLIC_ORIGIN:?请设置 HTTPS 域名}
      NOVELKING_ADMIN_USER: ${NOVELKING_ADMIN_USER:?请设置管理员用户名}
      NOVELKING_ADMIN_PASSWORD: ${NOVELKING_ADMIN_PASSWORD:-}
      NOVELKING_MAX_WORKERS: ${NOVELKING_MAX_WORKERS:-4}
      NOVELKING_AI_ORIGINS: ${NOVELKING_AI_ORIGINS:-https://api.deepseek.com,https://api.openai.com,https://anyai.token6688.com}
      NOVELKING_VMQ_CONFIG_FILE: ${NOVELKING_VMQ_CONFIG_FILE:-}
      NOVELKING_REGISTRATION: ${NOVELKING_REGISTRATION:-open}
      NOVELKING_DATABASE_URL: postgres://novelking:${NOVELKING_POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/novelking
      NOVELKING_MCP_ORIGINS: ${NOVELKING_MCP_ORIGINS:-https://mcp.exa.ai,https://mcp.tavily.com}
      NOVELKING_RANK_READER_URL: http://ranking-reader:3798
      NOVELKING_RANK_READER_TOKEN: ${NOVELKING_RANK_READER_TOKEN:?请设置榜单服务令牌}
      NOVELKING_TRUSTED_PROXIES: ${NOVELKING_PROXY_IP:-172.30.79.2}
    volumes:
      - novel-king-data:/var/lib/novel-king
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      writing:
        ipv4_address: ${NOVELKING_APP_IP:-172.30.79.3}
      database:
      rankings:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: novelking
      POSTGRES_USER: novelking
      POSTGRES_PASSWORD: ${NOVELKING_POSTGRES_PASSWORD:?请设置数据库密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelking -d novelking"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - database
  ranking-reader:
    build:
      context: .
      dockerfile: deploy/RankingReader.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NOVELKING_RANK_READER_TOKEN: ${NOVELKING_RANK_READER_TOKEN:?请设置榜单服务令牌}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - rankings
  proxy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NOVELKING_DOMAIN: ${NOVELKING_DOMAIN:?请设置域名}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - novel-king
    networks:
      writing:
        ipv4_address: ${NOVELKING_PROXY_IP:-172.30.79.2}
networks:
  database:
    internal: true
  rankings:
  writing:
    ipam:
      config:
        - subnet: ${NOVELKING_NETWORK_SUBNET:-172.30.79.0/24}
volumes:
  postgres-data:
  novel-king-data:
  caddy-data:
  caddy-config:
