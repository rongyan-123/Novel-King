services:
  novel-king:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3741:3741"
    environment:
      NOVELKING_PUBLIC_ORIGIN: ${NOVELKING_PUBLIC_ORIGIN:?请设置 HTTPS 域名}
      NOVELKING_ADMIN_USER: ${NOVELKING_ADMIN_USER:?请设置管理员用户名}
      NOVELKING_ADMIN_PASSWORD: ${NOVELKING_ADMIN_PASSWORD:-}
      NOVELKING_MAX_WORKERS: ${NOVELKING_MAX_WORKERS:-4}
      NOVELKING_AI_ORIGINS: ${NOVELKING_AI_ORIGINS:-https://api.deepseek.com,https://api.openai.com}
      NOVELKING_REGISTRATION: ${NOVELKING_REGISTRATION:-open}
      NOVELKING_TRUSTED_PROXIES: "172.30.79.2"
    volumes:
      - novel-king-data:/var/lib/novel-king
    mem_limit: 2g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      writing:
        ipv4_address: 172.30.79.3
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NOVELKING_DOMAIN: ${NOVELKING_DOMAIN:?请设置域名}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - novel-king
    networks:
      writing:
        ipv4_address: 172.30.79.2
networks:
  writing:
    ipam:
      config:
        - subnet: 172.30.79.0/24
volumes:
  novel-king-data:
  caddy-data:
  caddy-config:
